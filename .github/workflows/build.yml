name: Build & Release DualPointer Pro

on:
  push:
    branches:
      - main
      - master
    tags:
      - "*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Executable with PyInstaller
        run: |
          pyinstaller --noconfirm DualPointerPro.spec

      - name: Verify Executable & Compute Checksum
        shell: pwsh
        run: |
          $exePath = "dist\DualPointerPro.exe"
          if (!(Test-Path $exePath)) {
            Write-Error "Arquivo executável '$exePath' não foi encontrado após o build!"
            exit 1
          }
          $item = Get-Item $exePath
          $hash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash
          Write-Host "=========================================="
          Write-Host "Build Concluído com Sucesso!"
          Write-Host "Arquivo: $($item.FullName)"
          Write-Host "Tamanho: $([math]::Round($item.Length / 1MB, 2)) MB ($($item.Length) bytes)"
          Write-Host "SHA256:  $hash"
          Write-Host "=========================================="
          "$hash  DualPointerPro.exe" | Out-File -FilePath "dist\checksums.txt" -Encoding ascii

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualPointerPro-Windows-x64
          path: |
            dist/DualPointerPro.exe
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 30

      - name: Determine Release Tag
        id: release_tag
        shell: bash
        run: |
          python -c "
          import json, os
          ref = os.environ.get('GITHUB_REF', '')
          if ref.startswith('refs/tags/'):
              tag = ref.replace('refs/tags/', '')
          else:
              try:
                  with open('config.json', 'r', encoding='utf-8') as f:
                      ver = json.load(f).get('app', {}).get('version', '1.0.0')
              except Exception:
                  ver = '1.0.0'
              tag = ver if ver.startswith('v') else f'v{ver}'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'tag={tag}\n')
          print(f'Tag de Release definida automaticamente: {tag}')
          "

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: DualPointer Pro ${{ steps.release_tag.outputs.tag }}
          files: |
            dist/DualPointerPro.exe
            dist/checksums.txt
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
